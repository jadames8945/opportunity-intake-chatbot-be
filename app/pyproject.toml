[tool.poetry]
name = "paypal-agent-backend"
version = "0.1.0"
description = "PayPal Agent Backend with AI-powered chat and document generation"
authors = ["jadames <juan.adames@giantmachines.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.12"
uvicorn = {extras = ["standard"], version = "^0.34.2"}
celery = "^5.5.2"
redis = "^6.2.0"
langchain = "^0.3.25"

langchain-openai = "^0.3.18"
debugpy = "^1.8.14"
pydevd-pycharm = "^252.18003.35"
python-dotenv = "^1.1.0"

pymongo = "^4.13.2"
motor = "^3.6.0"
langchain-community = "^0.3.26"
python-multipart = "^0.0.20"
striprtf = "^0.0.26"
PyJWT = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pytz = "^2024.1"
pyairtable = "^3.2.0"


[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
pre-commit = "^4.3.0"
isort = "^6.0.1"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501", "W293", "W291", "F841", "F541", "F401", "E402"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".eggs",
    "*.egg",
]

[tool.poetry.scripts]
format = "scripts.format:main"
